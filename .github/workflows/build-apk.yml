name: build-apk

# Безопасность: никаких токенов и ключей в коде. Подпись release —
# только через GitHub Secrets (KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS,
# KEY_PASSWORD). Вставленный в чат PAT считать скомпрометированным:
# отозвать на github.com/settings/tokens и для push использовать новый
# (repo + workflow) локально, в Secrets его класть НЕ нужно.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (preinstalled + fallback)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: /tmp/gradle-8.7
          key: gradle-8.7-dist

      - name: Get Gradle 8.7
        run: |
          test -x /tmp/gradle-8.7/bin/gradle || {
            curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            mv /tmp/gradle-8.7 /tmp/gradle-8.7 2>/dev/null || true
          }
          /tmp/gradle-8.7/bin/gradle --version

      - name: Secret scan (fail on leaked tokens)
        run: |
          # NOTE: proot/payload/ is vendored + integrity-pinned
          # (proot/payload/zen-adapter.sha256). The zen-adapter carries its
          # PUBLIC builtin fallback key (sk-...), not ours — user keys live
          # only in Secrets/Settings and never in the repo. So payload/ is
          # excluded here; its checksum change is reviewed like code.
          ! grep -rInE 'github_pat_[A-Za-z0-9_]{22,}|gh[pousr]_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[bap]-[A-Za-z0-9-]{10,}' \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=payload --exclude=*.md . || \
            (echo 'LEAKED SECRET PATTERN FOUND'; exit 1)

      - name: Build debug APK
        working-directory: android
        run: /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-android-${{ github.sha }}-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Build signed release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'no keystore secrets — skip'; exit 0; }
          echo "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
          /tmp/gradle-8.7/bin/gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=/tmp/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
